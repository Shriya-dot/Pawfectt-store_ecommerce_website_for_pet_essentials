<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Pawfectt Store</title>
  <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UemF0utZ1o43xtyqZNicS.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    .navbar {
      background: #333;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin-left: 15px;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #333;
      color: #fff;
    }

    input,
    select {
      padding: 5px;
      margin: 3px;
      width: 100%;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    .add-btn {
      background: #28a745;
      color: #fff;
    }

    .update-btn {
      background: #007bff;
      color: #fff;
    }

    .delete-btn {
      background: #dc3545;
      color: #fff;
    }

    /* ✅ Remove spinner arrows from number inputs */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🐾 Pawfectt Admin</div>
    <div class="nav-links">
      <a href="{{ url_for('admin_order') }}">View Orders</a>
      <a href="{{ url_for('user_dashboard') }}">Home</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </header>

  <h1>Admin Dashboard</h1>

  <div class="container">
    <!-- Add Product Section -->
    <h2>Add New Product</h2>
    <table>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Image URL</th>
        <th>Action</th>
      </tr>
      <tr>
        <td><input type="text" id="name" /></td>
        <td>
          <select id="category">
            <option value="toys">Toys</option>
            <option value="food">Food</option>
            <option value="medicines">Medicines</option>
            <option value="groom">Groom</option>
          </select>
        </td>
        <td><input type="number" id="price" step="0.01" placeholder="Enter price" /></td>
        <td><input type="number" id="stock" min="0" placeholder="Enter stock" /></td>
        <td><input type="file" id="img" accept="image/*" /></td>
        <td><button class="add-btn" onclick="addProduct()">Add</button></td>
      </tr>
    </table>

    <!-- Existing Products Section -->
    <h2>Existing Products</h2>
    <table id="productTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody">
        <!-- Products dynamically loaded -->
      </tbody>
    </table>
  </div>

  <script>
    // Load products from backend
    async function loadProducts() {
      const res = await fetch("admin/get_products");
      const products = await res.json();
      const tableBody = document.getElementById("productTableBody");
      tableBody.innerHTML = "";

      products.forEach((p) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.name}</td>
          <td>${p.category}</td>
          <td>₹${p.price}</td>
          <td>
            <form action="/admin/update_stock/${p._id}" method="POST" style="display:flex; gap:5px; justify-content:center;">
              <input type="number" name="stock" value="${p.stock}" min="0" required placeholder="Enter stock">
              <button type="submit" class="update-btn">Update</button>
            </form>
          </td>
          <td>
            ${p.img
              ? `<img src="/static/images/${p.img}" alt="${p.name}" width="70" height="70" style="border-radius:8px; object-fit:cover;">`
              : "No Image"}
          </td>
          <td>
            <button class="delete-btn" onclick="deleteProduct('${p._id}')">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Add new product
    async function addProduct() {
      const name = document.getElementById("name").value.trim();
      const category = document.getElementById("category").value;
      const price = document.getElementById("price").value;
      const stock = document.getElementById("stock").value;
      const imgFile = document.getElementById("img").files[0];

      if (!name || !price || !stock) {
        alert("⚠ Please fill all required fields.");
        return;
      }

      const formData = new FormData();
      formData.append("name", name);
      formData.append("category", category);
      formData.append("price", price);
      formData.append("stock", stock);
      if (imgFile) formData.append("img", imgFile);

      const res = await fetch("/admin/add_product", {
        method: "POST",
        body: formData,
      });

      if (res.ok) {
        alert("✅ Product added successfully!");
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("img").value = "";
        loadProducts();
      } else {
        alert("❌ Failed to add product.");
      }
    }

    // Delete product
    async function deleteProduct(id) {
      if (!confirm("Are you sure you want to delete this product?")) return;

      const res = await fetch(`/admin/delete_product/${id}`, {
        method: "DELETE",
      });

      if (res.ok) {
        alert("🗑 Product deleted successfully!");
        loadProducts();
      } else {
        alert("❌ Failed to delete product.");
      }
    }

    // Initialize product list on page load
    document.addEventListener("DOMContentLoaded", loadProducts);
  </script>
</body>
</html>

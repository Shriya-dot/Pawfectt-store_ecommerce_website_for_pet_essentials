<!DOCTYPE-html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawfectt Admin Registration</title>
  <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UemF0utZ1o43xtyqZNicS.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c2ffd8, #465efb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #fff;
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
    }
    h2 { margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .btn {
      background: #465efb;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #2f44c4; }
    .login-link {
      display: block;
      margin-top: 20px;
      text-decoration: none;
      color: #465efb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin Registration</h2>
    <form action="{{ url_for('register_admin') }}" method="POST">
      <div class="form-group">
        <label for="username">Admin Username *</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Admin Email *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password *</label>
        <input type="password" id="confirm" name="confirm" required>
      </div>
      <button type="submit" class="btn">Register Admin</button>
    </form>
    <a href="{{ url_for('login_admin') }}" class="login-link">Already an Admin? Login</a>
  </div>
</body>
</html>

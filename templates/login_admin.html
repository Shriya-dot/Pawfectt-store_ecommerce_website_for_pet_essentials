<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawfectt Admin Login</title>
  <!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UemF0utZ1o43xtyqZNicS.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c2ffd8, #465efb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      display: flex;
      gap: 30px;
    }

    .card {
      background: #fff;
      padding: 30px 35px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      width: 340px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .btn {
      background: #465efb;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #2f44c4;
    }

    .center-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="main-container">
    
    <!-- Returning Admin -->
    <div class="card">
      <h2>Pawfectt Admin</h2>
      <form action="{{ url_for('login_admin') }}" method="POST">
        <div class="form-group">
          <label for="email">Admin Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- New Admin -->
    <div class="card">
      <h2>New Admin</h2>
      <p>Create a new admin account to manage the system with full access and control.</p>
      <div class="center-btn">
        <a href="{{ url_for('register_admin') }}">
          <button class="btn" type="button">Create Admin Account</button>
        </a>
      </div>
    </div>

  </div>
</body>
</html>
